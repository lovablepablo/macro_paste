[package]
name = "macro_paste"
version = "1.3.4"
edition = "2024"
description = "System tray app that pastes clipboard text as individual keystrokes"
license = "MIT"
repository = "https://github.com/lovablepablo/macro_paste"
authors = ["Nicolai Wolff"]
keywords = ["clipboard", "keyboard", "remote-desktop", "tray"]

[dependencies]
# System Tray (tray-icon re-exports muda 0.15 as tray_icon::menu)
tray-icon = "0.19"

# Event Loop (cross-platform message pump)
winit = "0.30"

# Global Hotkey (cross-platform)
global-hotkey = "0.6"

# Clipboard access (cross-platform)
arboard = "3"

# Config persistence
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Image decoding for loading the tray icon
image = { version = "0.25", default-features = false, features = ["ico", "png"] }

# --- Windows-only dependencies ---
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_Security",
] }
winreg = "0.55"

[target.'cfg(target_os = "windows")'.build-dependencies]
embed-resource = "3"

# --- macOS-only dependencies ---
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"
core-foundation = "0.10"
libc = "0.2"
