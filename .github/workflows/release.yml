name: Release

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: target/release/macro_paste.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: Create .app bundle
        run: |
          mkdir -p target/release/macro_paste.app/Contents/MacOS
          mkdir -p target/release/macro_paste.app/Contents/Resources
          cp target/release/macro_paste target/release/macro_paste.app/Contents/MacOS/macro_paste
          cp assets/Info.plist target/release/macro_paste.app/Contents/Info.plist
          cp assets/macro_paste.icns target/release/macro_paste.app/Contents/Resources/macro_paste.icns
          cd target/release && zip -r macro_paste-macos-arm64.zip macro_paste.app
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: target/release/macro_paste-macos-arm64.zip

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            windows/macro_paste.exe
            macos/macro_paste-macos-arm64.zip

  update-homebrew-tap:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos

      - name: Compute SHA256 and version
        id: sha
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA=$(sha256sum macro_paste-macos-arm64.zip | cut -d' ' -f1)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Checkout homebrew-tap
        uses: actions/checkout@v4
        with:
          repository: lovablepablo/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update cask file
        working-directory: homebrew-tap
        run: |
          sed -i \
            -e 's|^  version ".*"|  version "${{ steps.sha.outputs.version }}"|' \
            -e 's|^  sha256 ".*"|  sha256 "${{ steps.sha.outputs.sha256 }}"|' \
            Casks/macro_paste.rb

      - name: Commit and push to tap
        working-directory: homebrew-tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet Casks/macro_paste.rb; then
            echo "Cask is already up to date, nothing to commit."
            exit 0
          fi
          git add Casks/macro_paste.rb
          git commit -m "Bump macro_paste to ${{ steps.sha.outputs.version }}"
          git push
